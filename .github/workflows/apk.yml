name: Android-App bauen
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "supabase/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: node native/build-www.js
      - run: npx cap add android
      - run: node native/patch-android.js
        env: { BUILD_NUMBER: "${{ github.run_number }}" }
      - run: npx cap sync android
      - name: Schlüssel entschlüsseln
        env: { PILLEN_KEY_PASS: "${{ secrets.KEY_PASS }}" }
        run: |
          if [ -z "$PILLEN_KEY_PASS" ]; then echo "::error::Das Geheimnis KEY_PASS fehlt (GitHub → Settings → Secrets and variables → Actions)"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -in native/pillen.jks.enc -out android/app/pillen.jks -pass env:PILLEN_KEY_PASS
      - name: Bauen
        env: { PILLEN_KEY_PASS: "${{ secrets.KEY_PASS }}" }
        run: cd android && ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk pillen.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Pillen (Android-App)
          body: "Neueste Android-App. Herunterladen: pillen.apk antippen."
          files: pillen.apk
          make_latest: true
